# S² Capital: record each trading day's closing prices, then let the push
# trigger the normal Cloudflare Pages deploy.
name: S² Capital closing prices

on:
  schedule:
    - cron: '30 21 * * 1-5'   # 21:30 UTC = after the US close (DST and standard time)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-s2-prices.mjs
      - name: Commit if prices changed
        run: |
          if git diff --quiet src/data/s2-capital.json; then
            echo "No change"; exit 0
          fi
          git config user.name "s2-capital-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/s2-capital.json
          git commit -m "S² Capital: closing prices $(date -u +%F)"
          git push
